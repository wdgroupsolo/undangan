<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Luxury Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#E8C360" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7A1E" />
      <stop offset="100%" stop-color="#6E4A0C" />
    </linearGradient>

    <!-- Diamond Sparkle Gradient -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF9D2" />
      <stop offset="100%" stop-color="#E0B644" stop-opacity="0" />
    </radialGradient>

    <!-- Soft tab shadow for contrast on both dark & light browser tabs -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#ringShadow)">
    <!-- Left Ring (Groom's band) -->
    <circle 
      cx="25" 
      cy="36" 
      r="17" 
      stroke="url(#goldGradient)" 
      stroke-width="5" 
      fill="none" 
    />

    <!-- Right Ring (Bride's diamond band) -->
    <circle 
      cx="39" 
      cy="28" 
      r="17" 
      stroke="url(#goldGradient)" 
      stroke-width="5" 
      fill="none" 
    />

    <!-- Interlocking front-arc (creates realistic interwoven 3D ring effect) -->
    <path 
      d="M 23 20 A 17 17 0 0 1 33 24" 
      stroke="url(#goldGradient)" 
      stroke-width="5" 
      stroke-linecap="round" 
      fill="none" 
    />

    <!-- Diamond Solitaire Stone on Bride's Ring -->
    <!-- Diamond Prong Base -->
    <path 
      d="M 36.5 12 L 41.5 12 L 40 9 L 38 9 Z" 
      fill="url(#goldGradient)" 
    />

    <!-- Diamond Gem Facets -->
    <polygon 
      points="39,2 45,8 39,12 33,8" 
      fill="#FFFFFF" 
      stroke="#E2BE53" 
      stroke-width="0.8" 
    />
    <polygon 
      points="39,2 42,8 39,12 36,8" 
      fill="#F4F8FA" 
    />
    <polygon 
      points="39,2 39,12 37,8" 
      fill="#E1EFF5" 
    />

    <!-- Brilliant Diamond Sparkle Stars -->
    <path 
      d="M 39 0 L 40.5 4.5 L 45 6 L 40.5 7.5 L 39 12 L 37.5 7.5 L 33 6 L 37.5 4.5 Z" 
      fill="url(#sparkleGlow)" 
    />
    <!-- Sparkle Highlight Dot -->
    <circle cx="39" cy="6" r="1.5" fill="#FFFFFF" />
    <!-- Secondary Small Star Sparkle -->
    <path 
      d="M 48 3 L 49 5 L 51 6 L 49 7 L 48 9 L 47 7 L 45 6 L 47 5 Z" 
      fill="#FFF3C4" 
      opacity="0.9" 
    />
  </g>
</svg>