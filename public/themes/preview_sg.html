<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Secret Garden Preview Portrait</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 640px;
      height: 840px;
      overflow: hidden;
      background: #171114;
      font-family: 'Poppins', sans-serif;
    }

    .card-wrap {
      width: 640px;
      height: 840px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #2a1c22 0%, #161013 75%, #0c080a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-blur {
      position: absolute;
      inset: 0;
      background-image: url('/themes/secret-garden/assets/inner-cover.jpg');
      background-size: cover;
      background-position: center 20%;
      opacity: 0.32;
      filter: blur(16px);
      transform: scale(1.15);
    }

    .glow-top {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(195, 130, 145, 0.3) 0%, transparent 70%);
      top: -60px;
      right: -60px;
      filter: blur(40px);
    }

    .glow-bottom {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(150, 100, 115, 0.25) 0%, transparent 70%);
      bottom: -60px;
      left: -60px;
      filter: blur(40px);
    }

    /* Left Tilted Peek */
    .peek-left {
      position: absolute;
      left: 15px;
      top: 140px;
      width: 220px;
      height: 440px;
      border-radius: 34px;
      overflow: hidden;
      transform: rotate(-10deg) scale(0.88);
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      border: 4px solid rgba(255,255,255,0.18);
      z-index: 2;
      opacity: 0.9;
    }
    .peek-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Right Tilted Peek */
    .peek-right {
      position: absolute;
      right: 15px;
      top: 140px;
      width: 220px;
      height: 440px;
      border-radius: 34px;
      overflow: hidden;
      transform: rotate(10deg) scale(0.88);
      box-shadow: 0 25px 50px rgba(0,0,0,0.8);
      border: 4px solid rgba(255,255,255,0.18);
      z-index: 2;
      opacity: 0.9;
    }
    .peek-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Main Center Phone */
    .phone {
      width: 320px;
      height: 640px;
      background: #0f0d0e;
      border-radius: 48px;
      border: 8px solid #3d2f34;
      box-shadow: 0 30px 80px -10px rgba(0,0,0,0.95), 0 0 0 1px rgba(255,255,255,0.18);
      position: relative;
      overflow: hidden;
      z-index: 10;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      position: relative;
      background: #E6DED8;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone-notch {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 86px;
      height: 19px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
    }

    .screen-bg {
      position: absolute;
      inset: 0;
      background-image: url('/themes/secret-garden/assets/inner-cover.jpg');
      background-size: cover;
      background-position: top center;
    }

    .screen-content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 104px;
      text-align: center;
    }

    .sg-title {
      font-family: 'Playfair Display', serif;
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #261f22;
      font-weight: 600;
      margin-bottom: 2px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.95);
    }

    .sg-names {
      font-family: 'Great Vibes', cursive;
      font-size: 56px;
      color: #4e2330;
      line-height: 0.95;
      text-shadow: 0 1px 3px rgba(255,255,255,0.98), 0 0 1px rgba(255,255,255,0.9);
      font-weight: 500;
    }

    .sg-amp {
      font-family: 'Great Vibes', cursive;
      font-size: 32px;
      color: #4e2330;
      line-height: 0.85;
      margin: 0px 0;
      text-shadow: 0 1px 3px rgba(255,255,255,0.98);
    }

    .sg-date {
      font-family: 'Lora', serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: #4e2330;
      margin-top: 6px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.95);
    }

    .sg-button {
      margin-top: 24px;
      background: linear-gradient(135deg, #a8737d 0%, #6f424c 100%);
      color: #fff;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      padding: 8px 20px;
      border-radius: 30px;
      box-shadow: 0 8px 22px rgba(111, 66, 76, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Floating Feature Pills */
    .pill {
      position: absolute;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      color: #2b1f24;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      z-index: 20;
    }

    .pill-1 {
      top: 90px;
      left: 30px;
      border-left: 4px solid #9A6E76;
    }

    .pill-2 {
      bottom: 60px;
      left: 30px;
      border-left: 4px solid #9A6E76;
    }

    .pill-3 {
      top: 90px;
      right: 30px;
      border-left: 4px solid #b87a85;
    }

    .pill-4 {
      bottom: 60px;
      right: 30px;
      border-left: 4px solid #b87a85;
    }
  </style>
</head>
<body>
  <div class="card-wrap">
    <div class="bg-blur"></div>
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>

    <!-- Left Peek: Hero Wedding Walking Photo with Overlay -->
    <div class="peek-left">
      <div style="position: relative; width: 100%; height: 100%;">
        <img src="/themes/secret-garden/assets/cover-desktop.jpg" alt="Cover Desktop">
        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.35) 100%);"></div>
        <div style="position: absolute; bottom: 24px; left: 16px; right: 16px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.9);">
          <div style="font-family: 'Playfair Display', serif; font-size: 10px; margin-bottom: 2px;">Undangan Pernikahan</div>
          <div style="font-family: 'Great Vibes', cursive; font-size: 26px; line-height: 1.1;">Jessi&amp;Maudy</div>
          <div style="font-family: 'Playfair Display', serif; font-size: 8.5px; opacity: 0.95; margin-top: 3px;">Minggu, 27 Sept 2028</div>
        </div>
      </div>
    </div>

    <!-- Right Peek: Botanical Arch Fountain & Swans -->
    <div class="peek-right">
      <img src="/themes/secret-garden/assets/inner-cover.jpg" alt="Botanical Gateway">
    </div>

    <!-- Center Phone -->
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="screen-bg"></div>
        <div class="screen-content" style="padding-top: 185px;">
          <div class="sg-title">UNDANGAN PERNIKAHAN</div>
          <div class="sg-names">Jessi</div>
          <div class="sg-amp">&amp;</div>
          <div class="sg-names">Maudy</div>
          <div class="sg-date">27 . 09 . 2028</div>
          <div class="sg-button" style="margin-top: 18px;">
            <span>💌 Buka Undangan</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Pills -->
    <div class="pill pill-1">
      <span>🏛️</span>
      <span>Split-Screen Desktop</span>
    </div>
    <div class="pill pill-2">
      <span>🎬</span>
      <span>Video Entrance Arch</span>
    </div>
    <div class="pill pill-3">
      <span>🦢</span>
      <span>Swan Botanical Arch</span>
    </div>
    <div class="pill pill-4">
      <span>🌸</span>
      <span>Dusty Rose Theme</span>
    </div>
  </div>
</body>
</html>
